[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitws"
version = "0.1.0"
description = "A small, local Git workspace manager"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "gitws contributors"}]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]

[project.urls]
Repository = "https://github.com/cexianl/gitws"
Issues = "https://github.com/cexianl/gitws/issues"

[project.scripts]
gitws = "gitws.cli:main"

[tool.setuptools.packages.find]
include = ["gitws*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
