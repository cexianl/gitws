[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitws"
version = "0.1.0"
description = "A small, local Git workspace manager"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "gitws contributors"}]

[project.scripts]
gitws = "gitws.cli:main"

[tool.setuptools.packages.find]
include = ["gitws*"]
